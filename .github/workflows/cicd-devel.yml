name: CI/CD Devel

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image for Linter
        run: |
          docker build ./src \
            --file ./docker/ci/linter.Dockerfile \
            --tag icomphub-api-ci-linter:latest

      - name: Run Linter Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/src:/app \
            icomphub-api-ci-linter
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image for Format Check
        run: |
          docker build ./src \
            --file ./docker/ci/format-check.Dockerfile \
            --tag icomphub-api-ci-format-check:latest

      - name: Run Format Check
        run: |
          docker run --rm \
          -v ${{ github.workspace }}/src:/app \
          icomphub-api-ci-format-check
  deploy:
    if: github.ref_name == 'devel'
    needs: [linter, format-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Docker Image
        run: |
          docker build ./src --file ./docker/deploy/Dockerfile --tag icomphub-api-devel:latest

      - name: Save Docker Image as .tar
        run: |
          docker save icomphub-api-devel:latest -o icomphub-api-devel.tar

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER01_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER01_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Docker Image to Server
        run: |
          scp icomphub-api-devel.tar ${{ secrets.SERVER01_USER }}@${{ secrets.SERVER01_HOST }}:/tmp/icomphub-api-devel.tar

      - name: Run Docker Image on VPS
        run: |
          ssh ${{ secrets.SERVER01_USER }}@${{ secrets.SERVER01_HOST }} << 'EOF'
            set -e

            # Ensure upload directory exists and has proper permissions
            if [ ! -d "${{ vars.UPLOADS_DIR_DEVEL }}" ]; then
              sudo mkdir -p "${{ vars.UPLOADS_DIR_DEVEL }}"
              sudo chown -R $USER:$USER "${{ vars.UPLOADS_DIR_DEVEL }}"
            fi

            docker load -i /tmp/icomphub-api-devel.tar
            docker stop icomphub-api-devel || true
            docker rm icomphub-api-devel || true
            docker run -d \
              --name icomphub-api-devel \
              -p ${{ vars.API_PORT_DEVEL }}:8000 \
              -e IN_PRODUCTION=true \
              -e SWAGGER_API_URL=${{ vars.API_URL_DEVEL }} \
              -e INTERNAL_API_PORT=8000 \
              -e DB_HOST=${{ secrets.SERVER01_HOST }} \
              -e DB_PORT=${{ vars.DB_PORT_DEVEL }} \
              -e DB_USER=${{ vars.DB_USER_DEVEL }} \
              -e DB_PASSWORD=${{ secrets.DB_PW_DEVEL }} \
              -e DB_NAME=${{ vars.DB_DEVEL }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET_DEVEL }} \
              -v "${{ vars.UPLOADS_DIR_DEVEL }}":/app/static/uploads \
              icomphub-api-devel:latest
          EOF
