definitions:
  dto.TechnologyDTO:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  dto.TechnologyGetDTO:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      details:
        example: Detalhes adicionais do erro, se houver
        type: string
      error:
        example: Mensagem de erro descritiva
        type: string
    type: object
  models.StatusEnum:
    enum:
    - active
    - inactive
    - waiting_approval
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusInactive
    - StatusWaitingApproval
  models.SystemRoleEnum:
    enum:
    - admin
    - user
    - professor
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleProfessor
  models.Technology:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/models.StatusEnum'
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: integer
      institutional_email:
        type: string
      nickname:
        type: string
      personal_email:
        type: string
      registration:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/models.StatusEnum'
      system_role:
        $ref: '#/definitions/models.SystemRoleEnum'
      updated_at:
        type: string
    type: object
info:
  contact: {}
paths:
  /technologies:
    get:
      description: Get all technologies from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TechnologyGetDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all technologies
      tags:
      - Technologies
    post:
      consumes:
      - application/json
      description: Adiciona uma nova tecnologia ao sistema com base nos dados fornecidos.
      parameters:
      - description: Dados da Tecnologia para criar
        in: body
        name: technology
        required: true
        schema:
          $ref: '#/definitions/dto.TechnologyDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Tecnologia criada com sucesso
          schema:
            $ref: '#/definitions/models.Technology'
        "400":
          description: 'Erro: Entrada inválida" // <--- Alterado aqui'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 'Erro: Falha ao criar tecnologia" // <--- Alterado aqui'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Cria uma nova tecnologia
      tags:
      - Technologies
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma tecnologia com base no ID e nos dados
        fornecidos.
      parameters:
      - description: Dados da Tecnologia para atualizar
        in: body
        name: technology
        required: true
        schema:
          $ref: '#/definitions/dto.TechnologyGetDTO'
      produces:
      - application/json
      responses:
        "204":
          description: Tecnologia atualizada com sucesso (sem conteúdo)
        "400":
          description: 'Erro: Entrada inválida ou ID inválido'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: 'Erro: Tecnologia não encontrada'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 'Erro: Falha ao atualizar tecnologia'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Atualiza uma tecnologia existente
      tags:
      - Technologies
  /technologies/{id}:
    delete:
      consumes:
      - application/json
      description: Remove uma tecnologia do sistema com base no ID fornecido.
      parameters:
      - description: ID da Tecnologia a ser deletada
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Tecnologia deletada com sucesso (sem conteúdo)
        "400":
          description: 'Erro: ID inválido'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: 'Erro: Tecnologia não encontrada'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 'Erro: Falha ao deletar tecnologia'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Deleta uma tecnologia existente
      tags:
      - Technologies
  /users:
    get:
      description: Get all users from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all users
      tags:
      - users
swagger: "2.0"
