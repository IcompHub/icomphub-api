info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-string'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-any'
      summary: Login user
      tags:
      - auth
  /class_groups:
    get:
      parameters:
      - default: 1
        in: query
        minimum: 1
        name: pageNumber
        required: true
        type: integer
      - default: 10
        in: query
        minimum: 1
        name: pageSize
        required: true
        type: integer
      - example: Math 101
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-icomphub-api_dtos_PaginationDTO-dtos_ClassGroupDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-any'
      summary: List all class groups
      tags:
      - class_groups
    post:
      consumes:
      - application/json
      parameters:
      - description: ClassGroupCreateRequestDTO
        in: body
        name: ClassGroupCreateRequestDTO
        required: true
        schema:
          $ref: '#/definitions/dtos.ClassGroupCreateRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-dtos_ClassGroupDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-any'
      summary: Create a class group
      tags:
      - class_groups
  /class_groups/{id}:
    delete:
      parameters:
      - description: ClassGroup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-any'
      summary: Delete a class group
      tags:
      - class_groups
    get:
      parameters:
      - description: ClassGroup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-dtos_ClassGroupDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-any'
      summary: Find a class group
      tags:
      - class_groups
    put:
      consumes:
      - application/json
      parameters:
      - description: ClassGroup ID
        in: path
        name: id
        required: true
        type: integer
      - description: ClassGroupUpdateRequestDTO
        in: body
        name: ClassGroupUpdateRequestDTO
        required: true
        schema:
          $ref: '#/definitions/dtos.ClassGroupUpdateRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icomphub-api_dtos.Response-dtos_ClassGroupDTO'
        "500":
